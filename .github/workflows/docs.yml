name: Documentatie

# Bouwt de Doxygen-documentatie en publiceert die naar GitHub Pages.
# Eenmalige instelling: ga in de repo naar Settings > Pages en zet "Source"
# op "GitHub Actions". Daarna verschijnt de site op
# https://mertenf06.github.io/HuCalib/ en wordt hij bij elke push naar main
# automatisch bijgewerkt.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Rechten die de deploy naar Pages nodig heeft.
permissions:
  contents: read
  pages: write
  id-token: write

# Eén actieve publicatie tegelijk; nieuwe pushes vervangen een lopende run niet
# halverwege maar wachten netjes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Doxygen en Graphviz installeren
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Documentatie genereren
        run: |
          mkdir -p docs/doxygen
          doxygen Doxyfile

      - name: Pages-artifact uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/doxygen/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Naar GitHub Pages publiceren
        id: deployment
        uses: actions/deploy-pages@v4

name: GaitDynamics-CPU-proef

on:
  push:
    branches: [feat/recording-session-metadata]
    paths:
      - '.github/workflows/gaitdynamics-cpu.yml'
      - 'mocap_app/analysis/gaitdynamics*.py'
      - 'tools/*gaitdynamics.py'
      - 'requirements-gaitdynamics.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Afzonderlijke CPU-dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-gaitdynamics.txt
      - name: Officiële runtime met checksumcontrole
        run: python tools/setup_gaitdynamics.py --output gait-validation/runtime
      - name: Echte CPU-voorspelling
        env:
          MPLBACKEND: Agg
          CUDA_VISIBLE_DEVICES: ''
        run: python tools/smoke_gaitdynamics.py --runtime gait-validation/runtime --output gait-validation/result
      - name: Windows-adapter met echte Linux-rekenpayload (WSL-transport nagebootst)
        run: >-
          python tools/smoke_wsl_gaitdynamics.py --runtime gait-validation/runtime
          --motion gait-validation/example-header-corrected.mot
          --model gait-validation/examples/example_opensim_model.osim
          --output gait-validation/transport-result
      - name: Resultaat en foutdetails tonen
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          root = Path('gait-validation/result')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for name in ('gaitdynamics.json', 'environment.json', 'gaitdynamics.log'):
                  p = root / name
                  if p.exists():
                      value = p.read_text()[-2000:]
                      summary.write(f'### {name}\n```text\n{value}\n```\n')
                      if os.environ.get('INFERENCE_FAILED') == 'true' and name == 'gaitdynamics.log':
                          value = value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                          print(f'::error title=GaitDynamics-CPU::{value}')
          PY
        env:
          INFERENCE_FAILED: ${{ job.status == 'failure' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GaitDynamics-CPU-result-${{ github.sha }}
          path: |
            gait-validation/result/
            gait-validation/transport-result/
          if-no-files-found: ignore
          retention-days: 14
